# Qué productos cotiza el monitor: canasta de repostería.
#
# Cada producto tiene:
#   unidad:     cómo se compara el precio: kg (por kilo), l (por litro) o un (por unidad)
#   busquedas:  lo que se escribe en el buscador de cada supermercado
#   incluir:    el nombre debe tener al menos una de estas palabras (o pedazos de palabra)
#   requiere:   (opcional) el nombre debe tener además al menos una de estas
#   excluir:    (opcional) si el nombre tiene alguna de estas, se descarta
#   solo_congelado / asumir_congelado: (opcional) para productos que deben ser congelados
#
# Las mayúsculas y los tildes no importan: "azucar" también encuentra "Azúcar".
# '^' al inicio = el nombre debe EMPEZAR con eso ('^azucar' no deja pasar "Cereal con azúcar").
# '\b' marca palabra completa: '\bcon sal\b'.

# Palabras que descartan un producto en cualquier categoría
excluir_global:
  - mascota
  - perro
  - gato

productos:
  - nombre: Harina sin polvos de hornear
    unidad: kg
    busquedas: [harina sin polvos de hornear]
    incluir: ['^harina']
    requiere: [sin polvo]
    excluir: [integral, maiz, almendra, coco, arroz, avena, garbanzo, sin gluten, premezcla, mezcla]

  - nombre: Harina con polvos de hornear
    unidad: kg
    busquedas: [harina con polvos de hornear]
    incluir: ['^harina']
    requiere: [con polvo]
    excluir: [integral, maiz, almendra, coco, arroz, avena, garbanzo, sin gluten, premezcla, mezcla]

  - nombre: Azúcar granulada
    unidad: kg
    busquedas: [azucar granulada]
    incluir: ['^azucar']
    excluir: [flor, impalpable, glass, rubia, morena, mascabo, rubio, light, stevia, sucralosa, endulzante, cubo, sachet, sobre]

  - nombre: Azúcar flor
    unidad: kg
    busquedas: [azucar flor]
    incluir: ['^azucar']
    requiere: [flor, impalpable, glass]
    excluir: [light, stevia]

  - nombre: Mantequilla sin sal
    unidad: kg
    busquedas: [mantequilla sin sal]
    incluir: ['^mantequilla']
    requiere: [sin sal]
    excluir: [mani, cacahuate, almendra, margarina, ghee, ajo]

  - nombre: Huevos
    unidad: un
    busquedas: [huevos]
    incluir: ['^huevo']
    excluir: [codorniz, chocolate, pascua, sorpresa, polvo, deshidratad, liquid, clara, yema, cocido]

  - nombre: Leche entera
    unidad: l
    busquedas: [leche entera]
    incluir: ['^leche']
    requiere: [entera]
    excluir: [polvo, condensada, evaporada, sin lactosa, cultivada, fermentada, sabor, chocolate, frutilla, vainilla, almendra, avena, soya, coco, semi, descremada]

  - nombre: Crema de leche
    unidad: l
    busquedas: [crema para batir, crema de leche]
    incluir: ['^crema']
    requiere: [batir, de leche]
    excluir: [acida, vegetal, spray, chantilly, pastelera, facial, corporal, manos]

  - nombre: Leche condensada
    unidad: kg
    busquedas: [leche condensada]
    incluir: ['^leche condensada']
    excluir: [galleta, alfajor, manjar]

  - nombre: Manjar
    unidad: kg
    busquedas: [manjar]
    incluir: ['^manjar']
    excluir: [alfajor, galleta, torta, helado, barra, bombon, chocolate]

  - nombre: Chocolate para repostería
    unidad: kg
    busquedas: [chocolate reposteria, chocolate cobertura]
    incluir: [chocolate]
    requiere: [reposter, cobertura, fundir, bano de]
    excluir: [helado, galleta, salsa, manjar, bombon, relleno, leche condensada, mani]

  - nombre: Cacao amargo en polvo
    unidad: kg
    busquedas: [cacao amargo]
    incluir: ['^cacao']
    requiere: [amargo, polvo, 100]
    excluir: [bebida, instant, cereal, galleta, barra, manteca, nibs]

  - nombre: Polvos de hornear
    unidad: kg
    busquedas: [polvos de hornear]
    incluir: ['^polvos? de hornear', '^polvo hornear']
    excluir: [harina]

  - nombre: Esencia de vainilla
    unidad: l
    busquedas: [esencia de vainilla]
    incluir: ['^esencia', '^extracto']
    requiere: [vainilla]

  - nombre: Queso crema
    unidad: kg
    busquedas: [queso crema]
    incluir: ['^queso crema']
    excluir: [ciboulette, finas hierbas, salmon, ajo, pimienta, cebolla, aceituna, merken, tomate]
