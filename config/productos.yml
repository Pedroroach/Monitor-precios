# Qué productos cotiza el monitor: insumos de la pastelería (según lo que respondió la mamá de Pedro, 2026-11-03).
#
# Cada producto tiene:
#   unidad:     cómo se compara el precio: kg (por kilo), l (por litro) o un (por unidad)
#   busquedas:  lo que se escribe en el buscador de cada supermercado
#   incluir:    el nombre debe tener al menos una de estas palabras (o pedazos de palabra)
#   requiere:   (opcional) el nombre debe tener además al menos una de estas
#   excluir:    (opcional) si el nombre tiene alguna de estas, se descarta
#   marcas:     (opcional) solo estas marcas
#   excluir_marcas: (opcional) estas marcas no
#   referencia: (opcional) lo que paga hoy y dónde, para comparar en la Etapa 4
#   solo_congelado: (opcional) true = descarta lo que no sea congelado
#
# Las mayúsculas y los tildes no importan: "azucar" también encuentra "Azúcar".
# '^' al inicio = el nombre debe EMPEZAR con eso ('^azucar' no deja pasar "Cereal con azúcar").

# Palabras que descartan un producto en cualquier categoría
excluir_global:
  - mascota
  - perro
  - gato

productos:
  - nombre: Harina sin polvos de hornear
    unidad: kg
    busquedas: [harina sin polvos de hornear]
    incluir: ['^harina']
    requiere: [sin polvo]
    excluir: [integral, maiz, almendra, coco, arroz, avena, garbanzo, sin gluten, orgran, premezcla, mezcla]
    referencia: 'cualquier marca; la mejor es Selecta'

  - nombre: Azúcar granulada
    unidad: kg
    busquedas: [azucar granulada]
    incluir: ['^azucar']
    excluir: [flor, impalpable, glass, rubia, morena, mascabo, rubio, organic, dorad, light, stevia, sucralosa, endulzante, cubo, sachet, sobre]
    excluir_marcas: [maxima]   # muy gruesa y muy café

  - nombre: Azúcar flor
    unidad: kg
    busquedas: [azucar flor]
    incluir: ['^azucar']
    requiere: [flor, impalpable, glass]
    excluir: [light, stevia]

  - nombre: Mantequilla con sal
    unidad: kg
    busquedas: [mantequilla con sal, mantequilla colun, mantequilla quillayes]
    incluir: ['^mantequilla']
    requiere: [con sal]
    excluir: [sin sal, sin lactosa, mani, cacahuate, almendra, margarina, ghee, ajo]
    marcas: [colun, quillayes]
    referencia: 'Alvi $2.450 y $2.390'

  - nombre: Huevos extra
    unidad: un
    busquedas: [huevos extra]
    incluir: ['^huevo']
    requiere: [extra]
    excluir: [codorniz, vegan, chocolate, pascua, sorpresa, polvo, deshidratad, liquid, clara, yema, cocido, duro]
    referencia: 'Agrícola Omega 3: 7 bandejas de 30 a $31.000-$43.000'

  - nombre: Leche entera
    unidad: l
    busquedas: [leche entera]
    incluir: ['^leche']
    requiere: [entera]
    excluir: [polvo, condensada, evaporada, sin lactosa, cultivada, fermentada, sabor, chocolate, frutilla, vainilla, almendra, avena, soya, coco, semi, descremada, cabra, proteina]

  - nombre: Crema para batir Soprole
    unidad: l
    busquedas: [crema para batir, crema de leche soprole]
    incluir: ['^crema']
    requiere: [batir, de leche]
    excluir: [acida, vegetal, spray, chantilly, pastelera, light, sin lactosa, facial, corporal, manos]
    marcas: [soprole]
    referencia: 'Alvi (siempre el mejor precio)'

  - nombre: Leche condensada Nestlé
    unidad: kg
    busquedas: [leche condensada nestle, leche condensada]
    incluir: ['^leche condensada']
    excluir: [galleta, alfajor, manjar, sin lactosa, light, sin azucar]
    marcas: [nestle]
    referencia: 'compra en promoción bajo $1.590 (Jumbo o Líder)'

  - nombre: Chocolate para repostería
    unidad: kg
    busquedas: [chocolate reposteria, chocolate cobertura]
    incluir: ['^cobertura.*(chocolat|bitter)', '^chocolate.*(reposter|cobertura|fundir)']
    excluir: [glaseado, helado, galleta, salsa, relleno]

  - nombre: Cacao amargo Gourmet
    unidad: kg
    busquedas: [cacao amargo gourmet, cacao amargo]
    incluir: ['^cacao']
    requiere: [amargo, polvo, 100]
    excluir: [bebida, instant, cereal, galleta, barra, manteca, nibs]
    marcas: [gourmet]

  - nombre: Polvos de hornear
    unidad: kg
    busquedas: [polvos de hornear]
    incluir: ['^polvos? de hornear', '^polvo hornear']
    excluir: [harina]

  - nombre: Esencia de vainilla
    unidad: l
    busquedas: [esencia de vainilla]
    incluir: ['^esencia', '^extracto']
    requiere: [vainilla]

  - nombre: Queso crema
    unidad: kg
    busquedas: [queso crema, queso crema green bay, queso crema philadelphia]
    incluir: ['^queso crema']
    excluir: [light, reducido, calorias, sin lactosa, ciboulette, finas hierbas, salmon, ajo, pimienta, cebolla, aceituna, merken, tomate, salame, morron, jamon]
    marcas: ['green ?bay', philadelphia, cuisine]
    referencia: 'Green Bay 1,36 kg a $13.090 (la que prefiere); Philadelphia y Cuisine & Co también sirven'

  - nombre: Limón sutil
    unidad: kg
    busquedas: [limon sutil]
    incluir: ['^limon']
    requiere: [sutil]
    excluir: [jugo, sabor, galleta, helado, bebida, aceite, esencia, aderezo, '\bte\b']

  - nombre: Galletas de vino Dos en Uno
    unidad: kg
    busquedas: [galletas de vino]
    incluir: ['galleta.*vino']
    marcas: [dos en uno]
    referencia: 'Alvi (cree que siempre es el mejor precio)'

  - nombre: Frambuesas congeladas
    unidad: kg
    busquedas: [frambuesa congelada]
    incluir: [frambuesa]
    excluir: [mermelada, jugo, nectar, helado, yogur, salsa, galleta, chocolate, bebida, sabor, deshidratad, liofiliz, mix, mezcla, berries, frutilla, mora, arandano, '\bte\b']
    solo_congelado: true

  - nombre: Maracuyá congelado
    unidad: kg
    busquedas: [maracuya congelado, pulpa de maracuya]
    incluir: [maracuya]
    excluir: [jugo, nectar, bebida, helado, yogur, sabor, galleta, salsa, mermelada, mix, mezcla, '\bte\b']
    solo_congelado: true

  - nombre: Lúcuma congelada
    unidad: kg
    busquedas: [lucuma congelada, pulpa de lucuma]
    incluir: [lucuma]
    excluir: [helado, yogur, sabor, galleta, torta, manjar, harina, polvo, bebida, mix]
    solo_congelado: true
